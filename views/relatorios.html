<div class="relatorios-container">
  <h1>Relatório de Vendas</h1>

  <div class="relatorios-filtros">
    <label for="data-inicio">De:</label>
    <input type="date" id="data-inicio">
    <label for="data-fim">Até:</label>
    <input type="date" id="data-fim">
    <button id="btn-gerar-relatorio">Gerar Relatório</button>
    <button id="btn-exportar-csv" class="btn-exportar">Exportar para Excel (CSV)</button>
  </div>

  <div class="resumo-container">
    <div class="resumo-card">
      <h4>Total Faturado</h4>
      <p id="resumo-total-faturado">R$ 0,00</p>
    </div>
    <div class="resumo-card">
      <h4>Nº de Vendas</h4>
      <p id="resumo-num-vendas">0</p>
    </div>
    <div class="resumo-card">
      <h4>Ticket Médio</h4>
      <p id="resumo-ticket-medio">R$ 0,00</p>
    </div>
  </div>

  <h2>Vendas Detalhadas</h2>
  <div class="tabela-container">
    <table id="tabela-vendas">
      <thead>
      <tr>
        <th>ID Venda</th>
        <th>Data/Hora</th>
        <th>Itens</th>
        <th>Pagamento</th>
        <th>Total</th>
      </tr>
      </thead>
      <tbody id="tabela-vendas-body"></tbody>
    </table>
  </div>
</div>
